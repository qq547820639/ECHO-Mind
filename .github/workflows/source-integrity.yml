# source-integrity（ERA 12.7）：Source Package Integrity Gate。
#
# 职责：**每个 PR/push** 校验已提交的 SOURCE_MANIFEST 与当前工作树一致，
# 防止 stale hash / 旧快照清单进入 release。
# 正式 release 元数据（DELIVERY_MANIFEST/BUILD_PROVENANCE/ARTIFACT_MANIFEST）
# 由 android-ci 的 release-metadata job 在同一 pipeline run 内生成（build status 绑定）。
name: source-integrity
on:
  pull_request:
  push:
    branches: [main, "release/**"]
jobs:
  integrity:
    name: source manifest integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4 # TODO(ERA17): pin to commit SHA
      - uses: actions/setup-python@v7 # TODO(ERA17): pin to commit SHA
        with: {python-version: "3.12"}
      - name: python syntax check of integrity scripts
        run: python3 -m py_compile scripts/update_release_metadata.py scripts/generate_provenance.py scripts/verify_source_manifest.py
      - name: verify SOURCE_MANIFEST matches this checkout
        run: python3 scripts/verify_source_manifest.py
