# source-integrity（ERA 12.8）：Source Package Integrity Gate —— §5 同一道 Gate。
#
# 职责：**每个 PR/push** 校验：
#   1. 已提交的 SOURCE_MANIFEST 与 git 受控源文件集一致（stale hash 防回归）；
#   2. 确定性 source archive（zip + tar.gz）可由当前 checkout 重建；
#   3. archive 解包后 SOURCE_MANIFEST 再次 PASS（NFC / UTF-8 标志 / required / 双向清单）；
#   4. Distribution Integrity Test Suite（Unicode/篡改/缺失/意外文件负例）。
# 正式 release 元数据（DELIVERY_MANIFEST/BUILD_PROVENANCE/ARTIFACT_MANIFEST）
# 由 release-closure 在同一 pipeline run 内生成。
name: source-integrity
on:
  pull_request:
  push:
    branches: [main, "release/**"]
jobs:
  integrity:
    name: source manifest + archive gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.12"}
      - name: python syntax check of integrity scripts
        run: python3 -m py_compile scripts/update_release_metadata.py scripts/generate_provenance.py scripts/verify_source_manifest.py scripts/distribution.py scripts/build_source_archive.py scripts/verify_source_archive.py scripts/build_final_package.py scripts/verify_final_package.py scripts/verify_workflow_pins.py scripts/contract_compliance_check.py
      - name: workflow action pin gate（ERA 18 §93：uses 全部 pin immutable SHA）
        run: python3 scripts/verify_workflow_pins.py
      - name: verify SOURCE_MANIFEST matches this checkout（git 受控文件集）
        run: python3 scripts/verify_source_manifest.py
      - name: contract compliance anchor gate（ERA 84：CONTRACT_COMPLIANCE 锚点存在性）
        run: python3 scripts/contract_compliance_check.py
      - name: source reality report drift gate（ERA 12.9 §21：脚本重生成 + git diff）
        run: |
          python3 scripts/generate_source_reality.py
          git diff --exit-code docs/architecture/SOURCE_REALITY_REPORT.md
      - name: dependency graph drift gate（ERA 13.2 §48：脚本重生成 + git diff）
        run: |
          python3 scripts/generate_dependency_graph.py
          git diff --exit-code docs/architecture/ANDROID_DEPENDENCY_GRAPH.md
      - name: build deterministic source archive
        run: python3 scripts/build_source_archive.py --out-dir dist
      - name: verify extracted source archive（zip）
        run: python3 scripts/verify_source_archive.py dist/ECHO_Mind_PortraitCore_v*.zip
      - name: verify extracted source archive（tar.gz）
        run: python3 scripts/verify_source_archive.py dist/ECHO_Mind_PortraitCore_v*.tar.gz
      - name: distribution integrity test suite（Unicode / tamper / missing / unexpected）
        run: |
          pip install pytest
          python3 -m pytest scripts/test_source_archive.py -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: source-archives
          path: |
            dist/ECHO_Mind_PortraitCore_v*.zip
            dist/ECHO_Mind_PortraitCore_v*.tar.gz
