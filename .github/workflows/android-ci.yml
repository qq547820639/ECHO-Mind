# android-ci（T03 深化）：单元测试 + 组装 + lint 保留；新增 connectedTest/instrumentation 矩阵。
#
# 说明：
# - unit-lint job 为当前主验证（testDebugUnitTest + assembleDebug + lintDebug）；
# - connected-test job 需要真机/模拟器（外部验证事项）：当前 androidTest 源集尚未包含
#   instrumentation 测试类，任务会以「无测试」通过；接入时需补齐：
#     RoomMigrationInstrumentedTest（v3→v4→v5 迁移）
#     ProcessRecreationTest（ActiveSkillSession 进程重建恢复）
#     WorkManagerSyncTest（enqueue + run + 410/429 语义）
#     OnboardingFlowInstrumentedTest（七态 + verify-code）
#     PassiveSensingPermissionPathsTest（权限路径 + consent revoke）
#     SkillExecutionRecoveryTest（Skill 执行/恢复）
# - actions 暂 pin 到 major tag；上线前替换为 commit SHA（见 .github/dependabot.yml）。
name: android-ci
on:
  pull_request:
  push:
    branches: [main, "feat/**", "release/**"]
jobs:
  unit-lint:
    name: unit test + assemble + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4 # TODO(T03): pin to commit SHA
      - uses: actions/setup-java@v4 # TODO(T03): pin to commit SHA
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v4 # TODO(T03): pin to commit SHA
      - run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: cd android && chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug lintDebug --stacktrace
      # Kotlin SAST（detekt）：基线配置起步（android/detekt.yml）。
      # 待 CI 首跑验证：本机无 Gradle，未能本地验证 detekt 规则集与仓库现状兼容；
      # 首次跑通后再按 detekt.yml 内的策略逐步收紧规则集。
      - run: cd android && ./gradlew detekt --stacktrace
      - uses: actions/upload-artifact@v4 # TODO(T03): pin to commit SHA
        with:
          name: echo-mind-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  connected-test:
    name: instrumentation (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 36]
    steps:
      - uses: actions/checkout@v4 # TODO(T03): pin to commit SHA
      - uses: actions/setup-java@v4 # TODO(T03): pin to commit SHA
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v4 # TODO(T03): pin to commit SHA
      - uses: reactivecircus/android-emulator-runner@v2 # TODO(T03): pin to commit SHA
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4 # TODO(T03): pin to commit SHA
        if: always()
        with:
          name: connected-test-results-api${{ matrix.api-level }}
          path: android/app/build/reports/androidTests/connected/**
