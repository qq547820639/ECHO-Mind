# android-ci（T03 深化）：单元测试 + 组装 + lint 保留；新增 connectedTest/instrumentation 矩阵。
#
# 说明：
# - unit-lint job 为当前主验证（testDebugUnitTest + assembleDebug + lintDebug）；
# - connected-test job 在 API 34/36 模拟器执行 androidTest（v0.7.2 已补首批用例）：
#     EchoDatabaseMigrationInstrumentedTest（2→8 全链 + 7→8 单步 + ERA 45 补 8→11 全链与 10→11 索引单步，
#     MigrationTestHelper 校验）
#     EchoKeystoreInstrumentedTest（真机 Keystore 固定 IV 派生路径——曾致首启闪退的盲区）
#     LocalPortraitEngineInstrumentedTest（golden 场景设备烟测）
#     EchoSceneFrameDeviceBenchmarkInstrumentedTest（ERA 43 设备锚点：§65 硬指标 / 首帧计算 / Journey 365 装配）
#   后续可补：ProcessRecreation / WorkManagerSync / OnboardingFlow / PermissionPaths / SkillRecovery。
# - actions 全部 pin 到 immutable commit SHA（ERA 18 §93；`scripts/verify_workflow_pins.py` CI 门禁防漂移）。
name: android-ci
on:
  pull_request:
  push:
    branches: [main, "feat/**", "release/**"]
jobs:
  unit-lint:
    name: unit test + assemble + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: cd android && chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug lintDebug --stacktrace
      # Kotlin SAST（detekt 27 规则，maxIssues=0；本地每轮实测全绿，配置见 android/detekt.yml）
      - run: cd android && ./gradlew detekt --stacktrace
      # ERA 33：手环端静态测试（普通 Node 即可运行，无 Vela proprietary 工具链依赖）
      - run: cd wearable/xiaomi-vela && node tests/run.js
      # ERA 33：ANS_FRAME_V1 黄金门（ANSWatch 真实契约 ↔ schema ↔ Kotlin decoder）
      - run: python3 integrations/answatch/tools/verify_golden.py
      # v3.3 §13：build status 与本次 pipeline run 绑定（供 release-metadata job 消费）
      - run: echo "passed" > android-build-status.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: android-build-status
          path: android-build-status.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: echo-mind-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  release-metadata:
    name: release metadata (same pipeline run)
    needs: [unit-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: android-build-status
      - name: generate source manifest + delivery manifest (build status from THIS run)
        run: |
          export ANDROID_GRADLE_BUILD_RESULT="$(cat android-build-status.txt)"
          export REUSE_REPORT=1
          python3 scripts/update_release_metadata.py
      - name: deterministic source archive + extracted verification gate（ERA 12.8）
        run: |
          mkdir -p releases
          python3 scripts/build_source_archive.py --out-dir releases
          python3 scripts/verify_source_archive.py releases/ECHO_Mind_PortraitCore_v*.zip
          python3 scripts/verify_source_archive.py releases/ECHO_Mind_PortraitCore_v*.tar.gz
      - name: generate SBOM + provenance + artifact manifest
        run: |
          python3 scripts/generate_sbom.py
          python3 scripts/generate_provenance.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-metadata
          path: |
            SOURCE_MANIFEST.sha256
            RELEASE_ARTIFACT_MANIFEST.sha256
            DELIVERY_MANIFEST.json
            BUILD_PROVENANCE.json
            releases/ECHO_Mind_PortraitCore_v*.zip
            releases/ECHO_Mind_PortraitCore_v*.tar.gz

  connected-test:
    name: instrumentation (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808  # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: connected-test-results-api${{ matrix.api-level }}
          path: android/app/build/reports/androidTests/connected/**
