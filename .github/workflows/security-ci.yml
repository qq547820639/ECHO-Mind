# security-ci（T03 深化）：TruffleHog + SBOM + CodeQL(python) + dependency-review(PR)
# + pip-audit + osv-scanner + trivy filesystem。
#
# 说明：
# - Kotlin SAST 列为 P2（02c H.4）：v0.6 CodeQL 仅覆盖 python；Kotlin 经全仓 osv-scanner
#   覆盖 Gradle lockfile 依赖审计；
# - actions 全部 pin 到 immutable commit SHA（ERA 18 §93；`scripts/verify_workflow_pins.py` CI 门禁防漂移）。
# - dependency-review 仅在 pull_request 触发时生效。
name: security-ci
on:
  pull_request:
  schedule:
    - cron: "17 2 * * 1"
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11  # v3（原 @main 可变分支）
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      # CodeQL：python（autobuild）+ Kotlin SAST（P2 落地：manual build + Android SDK）
      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324  # v3
        with:
          languages: python, java-kotlin
          build-mode: manual
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3
      # ERA 41 对齐 android-ci：显式安装 platform（build-tools 由 AGP 选择兼容版本）
      - run: yes | sdkmanager "platforms;android-37"
      - name: Kotlin/Java 构建（CodeQL build tracing 提取用；仅编译不跑测试）
        run: (cd android && ./gradlew compileDebugKotlin --no-daemon)
      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324  # v3

      # dependency-review：仅 PR 触发（需 pull-requests: read）
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4
        if: github.event_name == 'pull_request'

      # Python 依赖审计：pip-audit（§96 收尾：改走 backend/uv.lock 锁定依赖，
      # 与本地 scripts/audit_dependencies.py 同构；osv-scanner 步骤继续覆盖全仓）
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.12"}
      - run: pip install 'uv>=0.7.0,<0.8' pip-audit
      - run: python3 scripts/audit_dependencies.py

      # Gradle/全仓依赖审计：osv-scanner（覆盖 gradle lockfile 与 Python 依赖）
      - uses: google/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1  # v2
        with:
          scan-args: "--recursive ."

      # 容器/文件系统扫描：trivy filesystem（backend 依赖目录）
      - uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # 0.24.0（验证 tag 存在）
        with:
          scan-type: fs
          scan-ref: backend/
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324  # v3
        with:
          sarif_file: trivy-results.sarif

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-and-security-reports
          path: |
            sbom.spdx.json
            trivy-results.sarif
