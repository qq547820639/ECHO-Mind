# backend-ci（T03 深化）：ruff + mypy + SQLite 测试 + PostgreSQL 测试/迁移 round-trip
# + coverage + 静态检查 + OpenAPI/契约漂移 + 故障注入矩阵。
#
# 说明：actions 全部 pin 到 immutable commit SHA（ERA 18 §93；`scripts/verify_workflow_pins.py` CI 门禁防漂移）。
# （.github/dependabot.yml 已启用 github-actions 自动升级）。
name: backend-ci
on:
  pull_request:
  push:
    branches: [main, "feat/**", "release/**"]
jobs:
  lint-typecheck:
    name: lint + typecheck (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.12"}
      - run: pip install 'uv>=0.7.0,<0.8'
      - name: uv sync --frozen（ERA 25：锁定依赖安装 + uv.lock 漂移门禁合一）
        run: uv sync --project backend --extra dev --frozen
      - run: uv run --project backend --directory backend ruff check app tests
      - run: uv run --project backend --directory backend mypy app

  test-sqlite:
    name: test (SQLite 默认路径)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.12"}
      - run: pip install uv
      - run: uv sync --project backend --extra dev --frozen
      - run: uv run --project backend --directory backend pytest -q

  test-postgres:
    name: test (PostgreSQL 16) + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: echo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/echo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.12"}
      - run: pip install uv
      - run: uv sync --project backend --extra dev --frozen
      # 跳过 sqlite_only 用例（conftest 根据 DATABASE_URL 自动 skip）；覆盖阈值见 coverage baseline
      - run: uv run --project backend --directory backend pytest -q -m "not sqlite_only" --cov=app --cov-report=term-missing --cov-fail-under=70

  alembic-postgres:
    name: alembic round-trip (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: echo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/echo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.12"}
      - run: pip install uv
      - run: uv sync --project backend --extra dev --frozen
      - run: uv run --project backend --directory backend alembic upgrade head
      - run: uv run --project backend --directory backend alembic downgrade base
      - run: uv run --project backend --directory backend alembic upgrade head

  static-checks:
    name: static checks (content / claims / dynamic code / safety eval)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.12"}
      - run: pip install uv
      - run: uv sync --project backend --extra dev --frozen
      - run: uv run --project backend python scripts/validate_content_packs.py
      - run: uv run --project backend python scripts/claim_scan.py
      - run: uv run --project backend python scripts/check_dynamic_code.py
      - run: uv run --project backend python scripts/safety_eval.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: api-and-safety-reports
          path: |
            docs/openapi.json
            safety-eval/evaluation_report.v1.json
            content-packs/MANIFEST.generated.json

  openapi-drift:
    name: OpenAPI drift (export + diff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.12"}
      - run: pip install uv
      - run: uv sync --project backend --extra dev --frozen
      - run: uv run --project backend --directory backend python scripts/export_openapi.py
      - run: git diff --exit-code docs/openapi.json

  contract-drift:
    name: contract drift + fault injection matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.12"}
      - run: python scripts/contract_drift_check.py
      - run: python scripts/fault_injection_check.py
