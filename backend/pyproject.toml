[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echo-mind-path-a"
version = "0.2.0"
description = "ECHO Mind Path A mobile backend and clinician console"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<0.141",
  "uvicorn[standard]>=0.35,<0.36",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.45,<3",
  "alembic>=1.16,<2",
  "PyJWT>=2.10,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "cryptography>=46,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["app"]
