[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echo-mind-portrait-core"
version = "0.9.0"
description = "ECHO Mind Path A mobile backend and clinician console"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<0.141",
  "uvicorn[standard]>=0.35,<0.36",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.45,<3",
  "alembic>=1.16,<2",
  "PyJWT>=2.10,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "cryptography>=50,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=6,<7",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

# 显式固定 lint 规则集为仓库历史默认（E4/E7/E9/F），避免新版 ruff 扩大默认
# select（UP017/I001/RUF059/B008 等）导致既有代码批量报错；规则集深化由 T03 CI 任务负责。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# mypy 配置（T03 CI）：check_untyped_defs 已收紧为 true，并移除 disable_error_code
# （原 "type-arg"/"assignment" 放宽项已不需要，`mypy app` 全量 0 error）。
# 下一步可评估 disallow_untyped_defs=true 与 ignore_missing_imports 的逐步收窄。
# CI job 跑 `mypy app`（不跑 tests，避免测试桩干扰）。
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = false
warn_unused_ignores = false
warn_unused_configs = false

[tool.hatch.build.targets.wheel]
packages = ["app"]
