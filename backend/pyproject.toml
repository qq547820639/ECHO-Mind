[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echo-mind-path-a"
version = "0.6.0"
description = "ECHO Mind Path A mobile backend and clinician console"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<0.141",
  "uvicorn[standard]>=0.35,<0.36",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.45,<3",
  "alembic>=1.16,<2",
  "PyJWT>=2.10,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "cryptography>=46,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=6,<7",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "mypy>=1.17,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

# 显式固定 lint 规则集为仓库历史默认（E4/E7/E9/F），避免新版 ruff 扩大默认
# select（UP017/I001/RUF059/B008 等）导致既有代码批量报错；规则集深化由 T03 CI 任务负责。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# mypy 配置（T03 CI）：从宽松起步——只检查显式标注的函数，忽略缺失 stub 的第三方库。
# 后续可逐步收紧：check_untyped_defs=true → disallow_untyped_defs=true → strict。
# 注：现有代码为 SQLAlchemy/JSON 字段类型较宽松，strict 全开会报大量 "type-arg" 类错误，
# 故先保持下列宽松项；CI job 跑 `mypy app`（不跑 tests，避免测试桩干扰）。
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = false
warn_unused_ignores = false
warn_unused_configs = false
# SQLAlchemy 2.0 Mapped 泛型在 pydantic/JSON 字段上需要大量类型参数标注，
# 先放宽泛型参数检查，避免既有代码批量报错（收紧时逐项补类型参数）。
disable_error_code = ["type-arg", "assignment"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
