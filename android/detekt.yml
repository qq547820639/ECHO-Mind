# detekt 基线配置（Kotlin SAST）。
#
# 策略：
# - buildUponDefaultConfig=false：只应用本文件显式声明的规则，不叠加 detekt 全量默认；
# - maxIssues 保持 0（零告警门禁）；
# - ERA 30 扩集（探测轮全绿后固化）：coroutines（GlobalCoroutineUsage/
#   RedundantSuspendModifier）、potential-bugs（ImplicitDefaultLocale/
#   ExplicitGarbageCollectionCall/MapGetWithNotNullAssertionOperator/
#   UnnecessarySafeCall/UselessPostfixExpression）、style（UnnecessaryAbstractClass/
#   NewLineAtEndOfFile/ProtectedMemberInFinalClass/ExplicitItLambdaParameter）。
#   （RedundantVisibilityModifier 已从 detekt 1.23 移除，不启用。）
# - ERA 37 扩集（探测→清除→固化）：style（UnusedImports/MayBeConst/
#   UnnecessaryParentheses）、potential-bugs（CastToNullableType/
#   DontDowncastCollectionTypes/LateinitUsage/UnusedUnaryOperator）、
#   coroutines（SleepInsteadOfDelay）、performance（ForEachOnRange/
#   UnnecessaryTemporaryInstantiation）。探测清除 60+ 处未用 import/多余括号
#   （全模块迭代）；LateinitUsage 主源集强制、测试源集豁免（JUnit 惯例）。
#   探测淘汰：CollapsibleIf 不存在于 1.23；MissingWhenCase/RedundantElseInWhen
#   已由编译器默认检查。

build:
  maxIssues: 0

# 命名规则：起步阶段整体关闭（仓库既有命名风格与 detekt 默认存在差异），
# 后续按团队约定单独开启并修复。
naming:
  active: false

style:
  # Compose 惯例使用通配 import（layout/material3 等），起步阶段关闭。
  WildcardImport:
    active: false
  # 传感/时间窗口/通知计数等业务代码含大量魔法数字，起步阶段关闭。
  MagicNumber:
    active: false
  # v0.7.2：低误报高信号规则（UnusedPrivateMember 覆盖未使用私有成员/参数）
  UnusedPrivateMember:
    active: true
    allowedNames: "(_|ignored|expected|serialVersionUID)"
  UnnecessaryAbstractClass:
    active: true
  NewLineAtEndOfFile:
    active: true
  ProtectedMemberInFinalClass:
    active: true
  ExplicitItLambdaParameter:
    active: true
  UnusedImports:
    active: true
  MayBeConst:
    active: true
  UnnecessaryParentheses:
    active: true

complexity:
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 12

potential-bugs:
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  UnreachableCode:
    active: true
  ImplicitDefaultLocale:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
  MapGetWithNotNullAssertionOperator:
    active: true
  UnnecessarySafeCall:
    active: true
  UselessPostfixExpression:
    active: true
  CastToNullableType:
    active: true
  DontDowncastCollectionTypes:
    active: true
  LateinitUsage:
    active: true
    # JUnit 惯例：测试替身 lateinit 于 setUp 初始化（33 处全在测试源集）；主源集强制禁止。
    excludes: ['**/src/test/**', '**/src/androidTest/**']
  UnusedUnaryOperator:
    active: true

coroutines:
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true

performance:
  ForEachOnRange:
    active: true
  UnnecessaryTemporaryInstantiation:
    active: true
