# detekt 基线配置（Kotlin SAST 起步）。
#
# 状态：待 CI 首跑验证（本机无 Gradle，无法本地执行 `./gradlew detekt`）。
# 策略：
# - buildUponDefaultConfig=false：只应用本文件显式声明的规则，不叠加 detekt 全量默认；
# - 从少数高信号、低误报规则起步，先让 CI 可运行；
# - 跑通后再逐步收紧（maxIssues 保持 0，逐规则开启更多 ruleset）。

build:
  maxIssues: 0

# 命名规则：起步阶段整体关闭（仓库既有命名风格与 detekt 默认存在差异），
# 后续按团队约定单独开启并修复。
naming:
  active: false

style:
  # Compose 惯例使用通配 import（layout/material3 等），起步阶段关闭。
  WildcardImport:
    active: false
  # 传感/时间窗口/通知计数等业务代码含大量魔法数字，起步阶段关闭。
  MagicNumber:
    active: false

complexity:
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 12

potential-bugs:
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  DuplicateCaseInWhenExpression:
    active: true
  UnreachableCode:
    active: true
